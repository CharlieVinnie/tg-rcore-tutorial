[package]
name = "tg-rcore-tutorial-ch4"
description = "Chapter 4 of rCore Tutorial: Address space management with SV39 virtual memory."
version = "0.4.2-preview.6"
edition = "2024"
authors = ["YdrMaster <ydrml@hotmail.com>","Yifan Wang<w-yf22@mails.tsinghua.edu.cn>","Yu Chen <yuchen@tsinghua.edu.cn>"]
repository = "https://github.com/rcore-os/tg-rcore-tutorial"
homepage = "https://github.com/rcore-os/tg-rcore-tutorial/tree/test"
documentation = "https://docs.rs/tg-ch4"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "virtual-memory"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-user/**",
#    ".cargo/config.toml",
]

[features]
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
xmas-elf = "0.8.0"
riscv = "0.10.1"

tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-sbi", version = "0.4.2-preview.6", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-linker", version = "0.4.2-preview.6" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-console", version = "0.4.2-preview.6" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-kernel-context", version = "0.4.2-preview.6", features = ["foreign"] }
tg-kernel-alloc = { package = "tg-rcore-tutorial-kernel-alloc", path = "../tg-kernel-alloc", version = "0.4.2-preview.6" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", path = "../tg-kernel-vm", version = "0.4.2-preview.6" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", path = "../tg-syscall", version = "0.4.2-preview.6", features = ["kernel"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-linker", version = "0.4.2-preview.6" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
