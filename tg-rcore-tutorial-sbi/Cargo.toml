[package]
name = "tg-rcore-tutorial-multi-processor-sbi-wzy"
description = "SBI (Supervisor Binary Interface) call wrappers for rCore tutorial OS that is used in multiprocessors"
version = "0.1.0-preview.1"
edition = "2024"
authors = ["Ziyan Wang <charliewang.cpp@gmail.com>"]
repository = "https://github.com/CharlieVinnie/tg-rcore-tutorial"
homepage = "https://github.com/CharlieVinnie/tg-rcore-tutorial/tree/smp"
documentation = "https://docs.rs/tg-rcore-tutorial-sbi"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]

[features]
default = []
nobios = []

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]

[dependencies]
