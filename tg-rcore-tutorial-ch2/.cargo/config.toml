# 默认编译目标：RISC-V 64 位裸机平台
# 使 cargo build 自动进行交叉编译，无需每次指定 --target
[build]
target = "riscv64gc-unknown-none-elf"

# QEMU 运行器配置
# cargo run 时自动调用此命令执行编译产物
[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",       # 使用 QEMU virt 虚拟平台
    "-device", "virtio-gpu-device,xres=800,yres=600", # 启用 VirtIO GPU
    "-display", "sdl",
    "-serial", "stdio",       # 保证控制台继续输出到终端
    "-bios", "none",          # 不加载外部 BIOS/SBI 固件（tg-sbi 内建）
    "-kernel",                # 后接 ELF 可执行文件路径（由 cargo 自动填充）
]

[env]
TG_GAME_CRATE    = "tg-rcore-tutorial-games-ch2-moving-tangram-user"
TG_GAME_LOCAL_DIR = "tg-rcore-tutorial-games/ch2"
TG_GAME_CACHE = "ch2-moving-tangram"
TG_GAME_BIN = "ch2-moving-tangram"
TG_GAME_VERSION  = "0.1.0-preview.1"
TG_GAME_APPS = "ch2-moving-tangram-1,ch2-moving-tangram-2,ch2-moving-tangram-3,ch2-moving-tangram-4,ch2-moving-tangram-5,ch2-moving-tangram-6,ch2-moving-tangram-7,ch2-moving-tangram-8,ch2-moving-tangram-9,ch2-moving-tangram-10,ch2-moving-tangram-11,ch2-moving-tangram-12,ch2-moving-tangram-13"
TG_GAME_BASE = "0x80600000"
TG_GAME_STEP = "0x200000"
