[package]
name = "tg-rcore-tutorial-multi-processor-ch1-wzy"
description = "Chapter 1 of rCore Tutorial: A minimal bare-metal application running in RISC-V S-mode, with SMP support."
version = "0.1.0-preview.1"
edition = "2024"
authors = ["Ziyan Wang <charliewang.cpp@gmail.com>"]
repository = "https://github.com/CharlieVinnie/tg-rcore-tutorial"
homepage = "https://github.com/CharlieVinnie/tg-rcore-tutorial/tree/smp"
documentation = "https://docs.rs/tg-rcore-tutorial-ch1"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
tg-sbi = { package = "tg-rcore-tutorial-multi-processor-sbi-wzy", version = "0.1.0-preview.1", features = ["nobios"] }
tg-rcore-tutorial-framework = { package = "tg-rcore-tutorial-multi-processor-framework-wzy", version = "0.1.0-preview.1" }
tg-console = { package = "tg-rcore-tutorial-multi-processor-console-wzy", version = "0.1.0-preview.1" }
spin = "0.9"
