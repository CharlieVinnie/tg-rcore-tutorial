# 默认编译目标：RISC-V 64 位裸机平台
# 使 cargo build 自动进行交叉编译，无需每次指定 --target
[build]
target = "riscv64gc-unknown-none-elf"

# QEMU 运行器配置
# cargo run 时自动调用此命令执行编译产物
[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",       # 使用 QEMU virt 虚拟平台
    "-drive", "file=target/riscv64gc-unknown-none-elf/debug/fs.img,if=none,format=raw,id=x0",
    "-device", "virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0",
    "-device", "virtio-gpu-device,xres=800,yres=600", # 启用 VirtIO GPU
    "-device", "virtio-keyboard-device",
    "-display", "sdl",
    "-serial", "stdio",       # 保证控制台继续输出到终端
    "-bios", "none",          # 不加载外部 BIOS/SBI 固件（tg-sbi 内建）
    "-kernel",                # 后接 ELF 可执行文件路径（由 cargo 自动填充）
]

[env]
TG_GAME_CRATE    = "tg-rcore-tutorial-games-ch6-breakout-user"
TG_GAME_LOCAL_DIR = "tg-rcore-tutorial-games/ch6"
TG_GAME_CACHE = "ch6-breakout"
TG_GAME_BIN = "user-shell,ch6-tetris,ch6-tangram,ch6-snake,ch6-keyshow,ch6-hello,ch6-forktest,ch6-pingpong,ch6-font,ch6-breakout"
TG_GAME_VERSION  = "0.1.0-preview.1"
TG_GAME_APPS = "user-shell,ch6-tetris,ch6-tangram,ch6-snake,ch6-keyshow,ch6-hello,ch6-forktest,ch6-pingpong,ch6-font,ch6-breakout"
TG_GAME_BASE = "0x0"
TG_GAME_STEP = "0x0"
INITPROC = "user-shell"